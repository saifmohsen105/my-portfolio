<section id="contact" class="contact section-block" aria-labelledby="contact-heading">
  <div class="container-page">
    <app-section-header
      appReveal
      index="07"
      eyebrow="Contact"
      headingId="contact-heading"
      title="Ready to talk about a role or a product build"
      subtitle="Hiring a full-stack Angular developer, or need help with a storefront, admin system, or bilingual SSR site? Send a short brief."
    />

    <div class="contact__grid">
      <div class="contact__info" appReveal>
        <a class="contact__email" [href]="'mailto:' + site.email">
          <span class="contact__email-label mono">Write directly</span>
          <span class="contact__email-address">{{ site.email }}</span>
        </a>

        <dl class="contact__details">
          <div>
            <dt class="mono">Phone</dt>
            <dd><a class="link-draw" [href]="'tel:' + phoneHref">{{ site.phone }}</a></dd>
          </div>
          <div>
            <dt class="mono">Location</dt>
            <dd>{{ site.location }} · Remote-friendly</dd>
          </div>
          <div>
            <dt class="mono">Social</dt>
            <dd class="contact__socials">
              @for (social of site.socials; track social.id) {
                @if (social.id !== 'email') {
                  <a class="link-draw" [href]="social.href" target="_blank" rel="noopener noreferrer">
                    {{ social.label }} ↗
                  </a>
                }
              }
            </dd>
          </div>
        </dl>
      </div>

      <div class="contact__panel" appReveal [revealDelay]="100">
        <p class="contact__panel-title mono">Send a brief</p>
        <app-contact-form />
      </div>
    </div>
  </div>
</section>

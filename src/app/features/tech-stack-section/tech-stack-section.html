<section id="stack" class="stack section-block" aria-labelledby="stack-heading">
  <div class="container-page">
    <div appReveal>
      <app-section-header
        eyebrow="Technical stack"
        title="Tools I use to ship production software"
        subtitle="Angular and TypeScript lead. Supporting tools cover APIs, data layers, and delivery."
      />
    </div>

    <div class="stack__filters" role="tablist" aria-label="Filter technologies" appReveal>
      @for (filter of filters; track filter) {
        <button
          type="button"
          role="tab"
          class="stack__filter"
          [class.stack__filter--active]="selected() === filter"
          [attr.aria-selected]="selected() === filter"
          (click)="select(filter)"
        >
          {{ filter }}
        </button>
      }
    </div>

    <ul class="stack__grid" appReveal>
      @for (item of filtered(); track item.name) {
        <li class="stack__item">
          @if (item.icon) {
            <img [src]="item.icon" [alt]="''" width="28" height="28" loading="lazy" />
          }
          <span>{{ item.name }}</span>
        </li>
      }
    </ul>
    <h2 id="stack-heading" class="visually-hidden">Tech stack</h2>
  </div>
</section>

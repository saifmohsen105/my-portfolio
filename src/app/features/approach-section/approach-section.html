<section id="approach" class="approach section-block" aria-labelledby="approach-heading">
  <div class="container-page approach__grid">
    <app-section-header
      class="approach__header"
      appReveal
      index="05"
      eyebrow="How I work"
      headingId="approach-heading"
      title="Engineering habits that keep products shippable"
      subtitle="A practical approach shaped by dashboards, marketplaces, and client delivery — not slide-deck methodology."
    />

    <ol class="approach__list">
      @for (item of items; track item.title; let i = $index) {
        <li class="approach__item" appReveal [revealDelay]="(i % 2) * 100">
          <span class="approach__index" aria-hidden="true">0{{ i + 1 }}</span>
          <h3>{{ item.title }}</h3>
          <p>{{ item.body }}</p>
        </li>
      }
    </ol>
  </div>
</section>

<section id="education" class="education section-block" aria-labelledby="education-heading">
  <div class="container-page">
    <div appReveal>
      <app-section-header
        eyebrow="Background"
        title="Education and focused certifications"
        subtitle="IT fundamentals, programming discipline, and Angular / .NET training."
      />
    </div>

    <div class="education__grid">
      <div class="education__col" appReveal>
        <h3 id="education-heading">Education</h3>
        <ul>
          @for (item of education; track item.id) {
            <li class="education__card">
              <p class="education__degree">{{ item.degree }}</p>
              <p class="education__school">{{ item.institution }}</p>
            </li>
          }
        </ul>
      </div>

      <div class="education__col" appReveal>
        <h3>Certificates</h3>
        <ul class="education__certs">
          @for (cert of certificates; track cert.id) {
            <li class="education__card">
              <p class="education__degree">{{ cert.title }}</p>
              <p class="education__school">{{ cert.issuer }}</p>
            </li>
          }
        </ul>
      </div>
    </div>
  </div>
</section>

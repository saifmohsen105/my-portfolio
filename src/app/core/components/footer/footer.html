<footer class="footer">
  <div class="container-page footer__inner">
    <a routerLink="/" class="footer__brand" aria-label="Saif Mohsen — Home">
      <app-brand-mark class="footer__mark" />
      <span>
        <span class="footer__name">{{ site.name }}</span>
        <span class="footer__role mono">{{ site.role }} · {{ site.location }}</span>
      </span>
    </a>

    <ul class="footer__links" aria-label="Social links">
      @for (social of site.socials; track social.id) {
        <li>
          <a
            class="link-draw"
            [href]="social.href"
            [attr.target]="social.id === 'email' ? null : '_blank'"
            [attr.rel]="social.id === 'email' ? null : 'noopener noreferrer'"
          >
            {{ social.label }}
          </a>
        </li>
      }
    </ul>

    <p class="footer__copy mono">© {{ year }} {{ site.firstName }} Mohsen · Built with Angular</p>
  </div>
</footer>

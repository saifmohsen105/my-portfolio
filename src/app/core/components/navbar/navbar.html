<header class="navbar" [class.navbar--scrolled]="scrolled()" [class.navbar--open]="open()">
  <div class="container-page navbar__inner">
    <a routerLink="/" class="navbar__brand" (click)="close()" aria-label="Saif Mohsen — Home">
      <img class="navbar__logo" src="images/logo.png" alt="" width="36" height="36" />
      <span class="navbar__brand-text">
        <span class="navbar__name">{{ site.firstName }} Mohsen</span>
        <span class="navbar__role">{{ site.role }}</span>
      </span>
    </a>

    <nav class="navbar__desktop" aria-label="Primary">
      @for (link of links; track link.label) {
        <a class="navbar__link" [href]="link.href" (click)="close()">{{ link.label }}</a>
      }
    </nav>

    <div class="navbar__actions">
      <button
        type="button"
        class="navbar__theme"
        (click)="toggleTheme()"
        [attr.aria-label]="ui.themeActionLabel()"
        [title]="ui.themeActionLabel()"
      >
        <span class="navbar__theme-icon" aria-hidden="true">
          @if (ui.isDark()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <path d="M21 14.3A8.5 8.5 0 1 1 9.7 3a7 7 0 0 0 11.3 11.3Z" />
            </svg>
          }
        </span>
      </button>

      <a appUiButton class="navbar__cta" href="/#contact" variant="primary">Hire me</a>

      <button
        type="button"
        class="navbar__menu-btn"
        [attr.aria-expanded]="open()"
        aria-controls="mobile-nav"
        [attr.aria-label]="open() ? 'Close menu' : 'Open menu'"
        (click)="toggle()"
      >
        <span class="navbar__menu-lines" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
    </div>
  </div>

  <div
    class="navbar__backdrop"
    [class.navbar__backdrop--visible]="open()"
    (click)="close()"
    aria-hidden="true"
  ></div>

  <aside
    id="mobile-nav"
    class="navbar__drawer"
    [class.navbar__drawer--open]="open()"
    [attr.aria-hidden]="!open()"
    role="dialog"
    aria-modal="true"
    aria-label="Mobile navigation"
  >
    <div class="navbar__drawer-head">
      <div class="navbar__drawer-brand">
        <img src="images/logo.png" alt="" width="32" height="32" />
        <div>
          <p class="navbar__drawer-name">{{ site.firstName }} Mohsen</p>
          <p class="navbar__drawer-meta">{{ site.location }}</p>
        </div>
      </div>
      <button type="button" class="navbar__drawer-close" aria-label="Close menu" (click)="close()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <nav class="navbar__drawer-nav" aria-label="Mobile">
      @for (link of links; track link.label; let i = $index) {
        <a class="navbar__drawer-link" [href]="link.href" (click)="close()">
          <span class="navbar__drawer-index">{{ i + 1 < 10 ? '0' + (i + 1) : i + 1 }}</span>
          <span>{{ link.label }}</span>
        </a>
      }
    </nav>

    <div class="navbar__drawer-foot">
      <button
        type="button"
        class="navbar__theme navbar__theme--drawer"
        (click)="toggleTheme()"
        [attr.aria-label]="ui.themeActionLabel()"
      >
        <span class="navbar__theme-icon" aria-hidden="true">
          @if (ui.isDark()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <path d="M21 14.3A8.5 8.5 0 1 1 9.7 3a7 7 0 0 0 11.3 11.3Z" />
            </svg>
          }
        </span>
        <span>{{ ui.themeLabel() }} mode</span>
      </button>

      <a appUiButton href="/#contact" variant="primary" (click)="close()">Hire me</a>
    </div>
  </aside>
</header>

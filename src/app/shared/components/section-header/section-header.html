<header class="section-header" [class.section-header--center]="align() === 'center'">
  <p class="section-header__kicker mono">
    @if (index()) {
      <span class="section-header__index">{{ index() }}</span>
    }
    <span class="section-header__rule" aria-hidden="true"></span>
    {{ eyebrow() }}
  </p>
  <h2 class="section-header__title" [attr.id]="headingId() || null">{{ title() }}</h2>
  @if (subtitle()) {
    <p class="section-header__subtitle">{{ subtitle() }}</p>
  }
</header>

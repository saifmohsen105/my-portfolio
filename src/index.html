<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Saif Mohsen — Full-Stack Developer (Angular + Node.js)</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portfolio of Saif Mohsen Refai — full-stack developer building Angular + Node.js products: marketplaces, ecommerce, admin systems, and bilingual SSR sites."
    />
    <meta
      name="keywords"
      content="Saif Mohsen, Full Stack Developer, Angular, Node.js, TypeScript, SHARY, Home Expand, Mustasharuna, Cairo"
    />
    <meta name="author" content="Saif Mohsen Refai" />
    <meta name="theme-color" content="#0a1014" />
    <script>
      (function () {
        var STORAGE_KEY = 'sm.ui.pref';
        var LEGACY_KEY = 'portfolio-theme';
        var SECRET = 'sm-portfolio-theme-v1';

        function xorBytes(input, secret) {
          var out = '';
          for (var i = 0; i < input.length; i++) {
            out += String.fromCharCode(input.charCodeAt(i) ^ secret.charCodeAt(i % secret.length));
          }
          return out;
        }

        function decodeTheme(raw) {
          if (!raw) return null;
          if (raw === 'light' || raw === 'dark') return raw;
          try {
            var json = xorBytes(decodeURIComponent(escape(atob(raw))), SECRET);
            var data = JSON.parse(json);
            if (data && (data.mode === 'light' || data.mode === 'dark')) return data.mode;
          } catch (e) {}
          return null;
        }

        try {
          var theme =
            decodeTheme(localStorage.getItem(STORAGE_KEY)) ||
            decodeTheme(localStorage.getItem(LEGACY_KEY)) ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a1014' : '#f3f6f7');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Saif Mohsen — Full-Stack Developer (Angular + Node.js)" />
    <meta

      content="Full-stack developer building production Angular + Node.js products for platforms, marketplaces, and dashboards."
